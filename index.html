function uid(prefix) {
  return (prefix || "id") + "-" + Math.random().toString(36).slice(2, 9);
}
function formatCurrency(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(v);
}
function formatPercent(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return v.toFixed(1) + " %";
}
function formatDateLocal(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-").map(Number);
  if (!y || !m || !d) return dateStr;
  return new Date(y, m - 1, d).toLocaleDateString("fr-FR");
}
function computeProfit(salePrice, purchasePrice, fees) {
  fees = fees || 0;
  return Math.round((salePrice - purchasePrice - fees) * 100) / 100;
}
function computeMargin(profit, salePrice) {
  if (!salePrice) return 0;
  return Math.round((profit / salePrice) * 1000) / 10;
}
function daysAgoStr(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}
function todayStr() { return daysAgoStr(0); }
function cn(...xs) { return xs.filter(Boolean).join(" "); }

/* ============================== PERFORMANCE CHART (SVG maison) ============================== */

const RANGES = [{ label: "7 j", days: 7 }, { label: "30 j", days: 30 }, { label: "3 mois", days: 90 }, { label: "12 mois", days: 365 }];

function PerformanceChart({ data }) {
  const [rangeIdx, setRangeIdx] = useState(1);
  const filtered = useMemo(() => {
    const days = RANGES[rangeIdx].days;
    const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0); cutoff.setDate(cutoff.getDate() - days);
    return data.filter((d) => {
      const [y, m, day] = d.date.split("-").map(Number);
      return new Date(y, m - 1, day) >= cutoff;
    });
  }, [data, rangeIdx]);

  return (
    <div className="rounded-xl2 border border-base-700 bg-base-900 p-5 shadow-soft">
      <div className="mb-4 flex items-center justify-between">
        <h3 className="text-sm font-medium text-base-100">Performance</h3>
        <div className="flex gap-1 rounded-lg bg-base-850 p-1">
          {RANGES.map((r, i) => (
            <button key={r.label} onClick={() => setRangeIdx(i)}
              className={cn("rounded-md px-2.5 py-1 text-xs font-medium transition-colors", i === rangeIdx ? "bg-accent text-base-950" : "text-base-400 hover:text-base-100")}>
              {r.label}
            </button>
          ))}
        </div>
      </div>
      {filtered.length === 0 ? (
        <div className="flex h-56 items-center justify-center text-sm text-base-500">Pas encore de ventes sur cette période</div>
      ) : (
        <AreaChartSVG data={filtered} />
      )}
    </div>
  );
}

function AreaChartSVG({ data }) {
  const W = 640, H = 224, padL = 40, padR = 8, padT = 12, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(1, ...data.map((d) => Math.max(d.revenue, d.profit))) * 1.15;
  const xAt = (i) => padL + (data.length === 1 ? innerW / 2 : (i / (data.length - 1)) * innerW);
  const yAt = (v) => padT + innerH - (v / maxVal) * innerH;

  function areaPath(key) {
    const pts = data.map((d, i) => [xAt(i), yAt(d[key])]);
    let d0 = "M" + pts.map((p) => p.join(",")).join(" L");
    d0 += ` L${xAt(data.length - 1)},${padT + innerH} L${xAt(0)},${padT + innerH} Z`;
    return d0;
  }
  function linePath(key) {
    const pts = data.map((d, i) => [xAt(i), yAt(d[key])]);
    return "M" + pts.map((p) => p.join(",")).join(" L");
  }
  const gridLines = [0.25, 0.5, 0.75, 1];
  const labelIdxs = data.length <= 1 ? [0] : [0, Math.floor((data.length - 1) / 2), data.length - 1];

  return (
    <div className="h-56 w-full">
      <svg viewBox={`0 0 ${W} ${H}`} className="h-full w-full" preserveAspectRatio="none">
        <defs>
          <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#c9a24b" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#c9a24b" stopOpacity="0" />
          </linearGradient>
          <linearGradient id="profGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#3ddc97" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#3ddc97" stopOpacity="0" />
          </linearGradient>
        </defs>
        {gridLines.map((g) => (
          <line key={g} x1={padL} x2={W - padR} y1={padT + innerH * (1 - g)} y2={padT + innerH * (1 - g)} stroke="#25282f" strokeDasharray="3 3" />
        ))}
        <path d={areaPath("revenue")} fill="url(#revGrad)" />
        <path d={areaPath("profit")} fill="url(#profGrad)" />
        <path d={linePath("revenue")} fill="none" stroke="#c9a24b" strokeWidth="2" />
        <path d={linePath("profit")} fill="none" stroke="#3ddc97" strokeWidth="2" />
        {labelIdxs.map((i) => (
          <text key={i} x={xAt(i)} y={H - 4} fontSize="10" fill="#6b7078" textAnchor={i === 0 ? "start" : i === data.length - 1 ? "end" : "middle"}>
            {formatDateLocal(data[i].date)}
          </text>
        ))}
      </svg>
      <div className="mt-1 flex items-center gap-4 text-[11px] text-base-400">
        <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-accent" /> Chiffre d'affaires</span>
        <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-positive" /> Bénéfice</span>
      </div>
    </div>
  );
}

  const events = [{ id: uid("ev"), event_type: "CREATION", created_at: product.purchase_date }];

  if (product.status === "ARCHIVE") events.push({ id: uid("ev"), event_type: "ARCHIVAGE", created_at: daysAgoStr(2) });
  return events;
}

      const sale_date = daysAgoStr(r.sale.daysAgo);
      product.actual_sale_price = r.sale.price;
      product.profit = net_profit;
      product.sale_date = sale_date;
      product.platform_id = r.sale.platform;
      sales.push({
        id: uid("sale"), product_id: id, product_title: r.title, product_brand: r.brand,
        platform_id: r.sale.platform, platform_name: platform.name, sale_price: r.sale.price,
        purchase_price: r.purchase_price, platform_fees, shipping_fees, net_profit, margin_percent, sale_date,
      });
      product.events = buildInventoryEvents(product, sale_date);
    } else {
      product.events = buildInventoryEvents(product, null);
    }
    products.push(product);
  });

  sales.sort((a, b) => b.sale_date.localeCompare(a.sale_date));
  return { products, sales, platforms };
}

function DashboardPage({ products, sales, navigate }) {
  const data = useMemo(() => {
    const revenue = sales.reduce((s, x) => s + x.sale_price, 0);
    const profit = sales.reduce((s, x) => s + x.net_profit, 0);
    const stockItems = products.filter((p) => p.status === "EN_STOCK" || p.status === "RESERVE");
    const stockValue = stockItems.reduce((s, p) => s + p.purchase_price, 0);
    const avgMargin = revenue > 0 ? (profit / revenue) * 100 : 0;
    const byDay = new Map();
    sales.forEach((s) => {
      const e = byDay.get(s.sale_date) || { revenue: 0, profit: 0 };
      e.revenue += s.sale_price; e.profit += s.net_profit;
      byDay.set(s.sale_date, e);
    });
    const chartData = Array.from(byDay.entries()).sort(([a], [b]) => a.localeCompare(b)).map(([date, v]) => ({ date, ...v }));
    const recentSales = [...sales].sort((a, b) => b.sale_date.localeCompare(a.sale_date)).slice(0, 5);
    const recentProducts = [...products].sort((a, b) => b.purchase_date.localeCompare(a.purchase_date)).slice(0, 5);
    return { revenue, profit, salesCount: sales.length, stockCount: stockItems.length, stockValue, avgMargin, chartData, recentSales, recentProducts };
  }, [products, sales]);

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-xl font-semibold text-base-100">Tableau de bord</h1>
        <p className="text-sm text-base-400">Vue d'ensemble de ton activité</p>
      </div>

      <div className="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-6">
        <StatCard label="Chiffre d'affaires" value={formatCurrency(data.revenue)} />
        <StatCard label="Bénéfice" value={formatCurrency(data.profit)} />
        <StatCard label="Ventes" value={String(data.salesCount)} />
        <StatCard label="Articles en stock" value={String(data.stockCount)} />
        <StatCard label="Valeur du stock" value={formatCurrency(data.stockValue)} />
        <StatCard label="Marge moyenne" value={formatPercent(data.avgMargin)} />
      </div>

      <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
        <Button full variant="primary" onClick={() => navigate("stock-new")}>+ Ajouter un article</Button>
        <Button full variant="secondary" onClick={() => navigate("stock", { status: "EN_STOCK" })}>Choisir un article à vendre</Button>
        <Button full variant="secondary" onClick={() => navigate("stock")}>Voir mon stock</Button>
        <Button full variant="secondary" onClick={() => navigate("analytics")}>Voir mes statistiques</Button>
      </div>

      <PerformanceChart data={data.chartData} />

      <div className="grid gap-4 md:grid-cols-2">
        <Card className="space-y-3">
          <h3 className="text-sm font-medium text-base-100">Ventes récentes</h3>
          {data.recentSales.length === 0 ? <EmptyState title="Aucune vente pour l'instant" /> : (
            <ul className="space-y-2">
              {data.recentSales.map((s) => (
                <li key={s.id} className="flex items-center justify-between text-sm">
                  <span className="truncate text-base-200">{s.product_title}</span>
                  <span className={s.net_profit >= 0 ? "font-medium text-positive" : "font-medium text-negative"}>{formatCurrency(s.net_profit)}</span>
                </li>
              ))}
            </ul>
          )}
        </Card>
        <Card className="space-y-3">
          <h3 className="text-sm font-medium text-base-100">Articles récents</h3>
          {data.recentProducts.length === 0 ? <EmptyState title="Aucun article pour l'instant" /> : (
            <ul className="space-y-2">
              {data.recentProducts.map((p) => (
                <li key={p.id} className="flex items-center justify-between text-sm">
                  <button onClick={() => navigate("stock-detail", { id: p.id })} className="truncate text-base-200 hover:text-accent">{p.title}</button>

function ProductForm({ product, platforms, onSubmit, onCancel }) {
  const isEdit = !!product;
  const [form, setForm] = useState(() => ({
    title: product?.title || "", description: product?.description || "", brand: product?.brand || "",
    category: product?.category || "", subcategory: product?.subcategory || "", size: product?.size || "",
    color: product?.color || "", condition: product?.condition || "", purchase_price: product?.purchase_price ?? "",
    expected_sale_price: product?.expected_sale_price ?? "", platform_id: product?.platform_id || "",
    location: product?.location || "", notes: product?.notes || "",
  }));
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const purchasePrice = Number(form.purchase_price) || 0;
  const expectedPrice = Number(form.expected_sale_price) || 0;
  const profit = expectedPrice - purchasePrice;
  const margin = expectedPrice > 0 ? (profit / expectedPrice) * 100 : 0;

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.title.trim() || form.purchase_price === "") return;
    onSubmit({
      ...form,
      purchase_price: purchasePrice,
      expected_sale_price: form.expected_sale_price === "" ? null : expectedPrice,
      platform_id: form.platform_id || null,
    });
  }

  return (
    <form onSubmit={handleSubmit} className="space-y-5">
      <Card className="space-y-4">
        <Input label="Titre *" value={form.title} onChange={set("title")} placeholder="Ex : Sac à main cuir noir" required />
        <Textarea label="Description" rows={3} value={form.description} onChange={set("description")} placeholder="Détails, particularités…" />
        <div className="grid grid-cols-2 gap-3">
          <Input label="Marque" value={form.brand} onChange={set("brand")} placeholder="Ex : Chanel" />
          <Select label="Catégorie" value={form.category} onChange={set("category")}>

            {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}

        </div>
        <div className="grid grid-cols-3 gap-3">
          <Input label="Sous-catégorie" value={form.subcategory} onChange={set("subcategory")} />
          <Input label="Taille" value={form.size} onChange={set("size")} />
          <Input label="Couleur" value={form.color} onChange={set("color")} />
        </div>
        <Select label="État" value={form.condition} onChange={set("condition")}>
          <option value="">—</option>
          {CONDITIONS.map((c) => <option key={c} value={c}>{c}</option>)}
        </Select>
      </Card>

      <Card className="space-y-4">
        <h3 className="text-sm font-medium text-base-100">Prix</h3>
        <div className="grid grid-cols-2 gap-3">
          <Input label="Prix d'achat *" type="number" step="0.01" min="0" value={form.purchase_price} onChange={set("purchase_price")} required />
          <Input label="Prix de vente prévu" type="number" step="0.01" min="0" value={form.expected_sale_price} onChange={set("expected_sale_price")} />
        </div>
        <div className="flex items-center justify-between rounded-xl bg-base-850 px-4 py-3 text-sm">
          <span className="text-base-400">Bénéfice potentiel</span>
          <span className={profit >= 0 ? "font-semibold text-positive" : "font-semibold text-negative"}>
            {formatCurrency(profit)} ({formatPercent(margin)})
          </span>
        </div>
      </Card>

      <Card className="space-y-4">
        <h3 className="text-sm font-medium text-base-100">Logistique</h3>
        <Select label="Plateforme" value={form.platform_id} onChange={set("platform_id")}>
          <option value="">—</option>
          {platforms.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </Select>
        <Input label="Emplacement" value={form.location} onChange={set("location")} placeholder="Ex : Étagère A2" />
        <Textarea label="Notes" rows={2} value={form.notes} onChange={set("notes")} />

        <Button type="submit" full>{isEdit ? "Enregistrer les modifications" : "Ajouter au stock"}</Button>
      </div>
    </form>
  );

function SalesPage({ sales }) {
  const [q, setQ] = useState("");
  const filtered = useMemo(() => sales.filter((s) => (q ? s.product_title.toLowerCase().includes(q.toLowerCase()) : true)), [sales, q]);
  const totalRevenue = filtered.reduce((s, x) => s + x.sale_price, 0);
  const totalProfit = filtered.reduce((s, x) => s + x.net_profit, 0);

  return (
    <div className="space-y-5 fade-in">
      <div>
        <h1 className="text-xl font-semibold text-base-100">Ventes</h1>
        <p className="text-sm text-base-400">{filtered.length} vente(s) · {formatCurrency(totalRevenue)} de CA · {formatCurrency(totalProfit)} de bénéfice</p>
      </div>

      <div className="relative">
        <SearchIcon width={16} height={16} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-base-500" />
        <input type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher une vente…"
          className="w-full rounded-xl border border-base-600 bg-base-850 py-2.5 pl-9 pr-3.5 text-sm text-base-100 outline-none focus:border-accent" />
      </div>

      {filtered.length === 0 ? (
        <EmptyState title="Aucune vente enregistrée" description="Vends un article depuis sa fiche produit pour la voir apparaître ici." />
      ) : (
        <div className="space-y-2">
          {filtered.map((s) => (
            <Card key={s.id} className="flex items-center justify-between p-4">
              <div className="min-w-0">
                <p className="truncate text-sm font-medium text-base-100">{s.product_title}</p>
                <p className="text-xs text-base-400">{s.platform_name || "—"} · {formatDateLocal(s.sale_date)}</p>
              </div>
              <div className="shrink-0 text-right">
                <p className="text-sm font-semibold text-base-100">{formatCurrency(s.sale_price)}</p>
                <p className={s.net_profit >= 0 ? "text-xs text-positive" : "text-xs text-negative"}>{formatCurrency(s.net_profit)} ({formatPercent(s.margin_percent)})</p>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function rank(sales, keyFn) {
  const map = new Map();
  sales.forEach((s) => { const k = keyFn(s); map.set(k, (map.get(k) || 0) + s.net_profit); });
  return Array.from(map.entries()).sort(([, a], [, b]) => b - a).slice(0, 5);
}
function RankingCard({ title, items }) {
  return (
    <Card className="space-y-3">
      <h3 className="text-sm font-medium text-base-100">{title}</h3>
      {items.length === 0 ? <EmptyState title="Pas encore de données" /> : (
        <ul className="space-y-2">
          {items.map(([name, value], i) => (
            <li key={name} className="flex items-center justify-between text-sm">
              <span className="truncate text-base-300">{i + 1}. {name}</span>
              <span className={value >= 0 ? "font-medium text-positive" : "font-medium text-negative"}>{formatCurrency(value)}</span>
            </li>
          ))}
        </ul>
      )}
    </Card>
  );
}

function AnalyticsPage({ products, sales }) {
  const data = useMemo(() => {
    const revenue = sales.reduce((s, x) => s + x.sale_price, 0);
    const profit = sales.reduce((s, x) => s + x.net_profit, 0);
    const avgMargin = revenue > 0 ? (profit / revenue) * 100 : 0;
    const avgBasket = sales.length > 0 ? revenue / sales.length : 0;
    const stockValue = products.filter((p) => p.status === "EN_STOCK" || p.status === "RESERVE").reduce((s, p) => s + p.purchase_price, 0);
    const byDay = new Map();
    sales.forEach((s) => { const e = byDay.get(s.sale_date) || { revenue: 0, profit: 0 }; e.revenue += s.sale_price; e.profit += s.net_profit; byDay.set(s.sale_date, e); });
    const chartData = Array.from(byDay.entries()).sort(([a], [b]) => a.localeCompare(b)).map(([date, v]) => ({ date, ...v }));
    return {
      revenue, profit, avgMargin, avgBasket, stockValue, chartData,
      byProduct: rank(sales, (s) => s.product_title || "—"),
      byBrand: rank(sales, (s) => s.product_brand || "—"),
      byPlatform: rank(sales, (s) => s.platform_name || "—"),
      byCategory: rank(sales, (s) => products.find((p) => p.id === s.product_id)?.category || "—"),
    };
  }, [products, sales]);

  return (
    <div className="space-y-6 fade-in">
      <div>
        <h1 className="text-xl font-semibold text-base-100">Analytics</h1>
        <p className="text-sm text-base-400">Performance globale de ton activité</p>
      </div>

      <div className="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-6">
        <StatCard label="CA total" value={formatCurrency(data.revenue)} />
        <StatCard label="Bénéfice total" value={formatCurrency(data.profit)} />
        <StatCard label="Marge moyenne" value={formatPercent(data.avgMargin)} />
        <StatCard label="Nombre de ventes" value={String(sales.length)} />
        <StatCard label="Panier moyen" value={formatCurrency(data.avgBasket)} />
        <StatCard label="Valeur du stock" value={formatCurrency(data.stockValue)} />
      </div>

      <PerformanceChart data={data.chartData} />

      <div className="grid gap-4 md:grid-cols-2">
        <RankingCard title="Produits les plus rentables" items={data.byProduct} />
        <RankingCard title="Marques les plus rentables" items={data.byBrand} />
        <RankingCard title="Plateformes les plus rentables" items={data.byPlatform} />
        <RankingCard title="Catégories les plus rentables" items={data.byCategory} />
      </div>
    </div>
  );
}

function PlatformManager({ platforms, onAdd, onDelete }) {
  const [name, setName] = useState("");
  const [fee, setFee] = useState("");
  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onAdd({ name: name.trim(), fee_percent: Number(fee) || 0 });
    setName(""); setFee("");
  }
  return (
    <div className="space-y-3">
      {platforms.length ? (
        <ul className="space-y-1 text-sm text-base-300">
          {platforms.map((p) => (
            <li key={p.id} className="flex items-center justify-between gap-2">
              <span>{p.name}</span>
              <div className="flex items-center gap-2">
                <span className="text-base-400">{p.fee_percent}% de frais</span>
                <button type="button" onClick={() => onDelete(p.id, p.name)} className="text-xs text-base-500 hover:text-negative" aria-label={`Supprimer ${p.name}`}>Supprimer</button>
              </div>
            </li>
          ))}
        </ul>
      ) : <p className="text-sm text-base-400">Aucune plateforme configurée.</p>}
      <form onSubmit={submit} className="flex gap-2 pt-2">
        <Input value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : Depop" className="flex-1" />
        <Input value={fee} onChange={(e) => setFee(e.target.value)} type="number" min="0" max="100" step="0.1" placeholder="% frais" className="w-24" />
        <Button type="submit" variant="secondary">Ajouter</Button>
      </form>
    </div>
  );
}

function SettingsPage({ platforms, onAddPlatform, onDeletePlatform }) {
  const toast = useToast();
  return (
    <div className="mx-auto max-w-xl space-y-5 fade-in">
      <h1 className="text-xl font-semibold text-base-100">Paramètres</h1>

      <Card className="space-y-2">
        <h3 className="text-sm font-medium text-base-100">Compte</h3>
        <p className="text-sm text-base-300">demo@resellai.app</p>
        <p className="text-xs text-base-400">Plan : free · compte de démonstration</p>
      </Card>

      <Card className="space-y-3">
        <h3 className="text-sm font-medium text-base-100">Plateformes de vente</h3>
        <PlatformManager platforms={platforms} onAdd={onAddPlatform} onDelete={onDeletePlatform} />
      </Card>

      <Card className="space-y-2">
        <h3 className="text-sm font-medium text-base-100">À venir</h3>
        <p className="text-sm text-base-400">IA, marketplaces, automatisations, assistant et abonnements arrivent dans les prochaines versions.</p>
      </Card>

      <Button variant="secondary" full onClick={() => toast("Version de démonstration — pas d'authentification réelle")}>Se déconnecter</Button>
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const [state, setState] = useState(() => seedData());
  const [route, setRoute] = useState({ page: "dashboard", params: {} });
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  function navigate(page, params) {
    setRoute({ page, params: params || {} });
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function handleCreateProduct(data) {
    const id = uid("prod");
    const purchase_date = todayStr();
    const product = {
      id, ...data, actual_sale_price: null, profit: null, status: "EN_STOCK",
      purchase_date, sale_date: null,
      events: [{ id: uid("ev"), event_type: "CREATION", created_at: purchase_date }],
    };
    setState((s) => ({ ...s, products: [product, ...s.products] }));
    showToast("Article ajouté au stock");
    navigate("stock-detail", { id });
  }

  function handleUpdateProduct(id, data) {
    setState((s) => ({
      ...s,
      products: s.products.map((p) => p.id === id ? {
        ...p, ...data,
        events: [...p.events, { id: uid("ev"), event_type: "MODIFICATION", created_at: todayStr() }],
      } : p),
    }));
    showToast("Modifications enregistrées");
    navigate("stock-detail", { id });
  }

  function handleSell(productId, saleData) {
    setState((s) => {
      const product = s.products.find((p) => p.id === productId);
      if (!product) return s;
      const totalFees = saleData.platform_fees + saleData.shipping_fees;
      const netProfit = computeProfit(saleData.sale_price, product.purchase_price, totalFees);
      const margin = computeMargin(netProfit, saleData.sale_price);
      const platform = s.platforms.find((p) => p.id === saleData.platform_id);
      const sale = {
        id: uid("sale"), product_id: productId, product_title: product.title, product_brand: product.brand,
        platform_id: saleData.platform_id, platform_name: platform?.name || null,
        sale_price: saleData.sale_price, purchase_price: product.purchase_price,
        platform_fees: saleData.platform_fees, shipping_fees: saleData.shipping_fees,
        net_profit: netProfit, margin_percent: margin, sale_date: saleData.sale_date,
      };
      return {
        ...s,
        sales: [sale, ...s.sales],
        products: s.products.map((p) => p.id === productId ? {
          ...p, status: "VENDU", actual_sale_price: saleData.sale_price, profit: netProfit,
          sale_date: saleData.sale_date, platform_id: saleData.platform_id,
          events: [...p.events, { id: uid("ev"), event_type: "VENTE", created_at: saleData.sale_date }],
        } : p),
      };
    });
    showToast("Vente enregistrée");
  }

  function handleArchive(id) {
    setState((s) => ({
      ...s,
      products: s.products.map((p) => p.id === id ? {
        ...p, status: "ARCHIVE",
        events: [...p.events, { id: uid("ev"), event_type: "ARCHIVAGE", created_at: todayStr() }],
      } : p),
    }));
    showToast("Article archivé");
  }

  function handleDelete(id) {
    if (!window.confirm("Supprimer définitivement cet article ? Cette action est irréversible.")) return;
    setState((s) => ({ ...s, products: s.products.filter((p) => p.id !== id) }));
    showToast("Article supprimé");
    navigate("stock");
  }

  function handleAddPlatform(data) {
    setState((s) => ({ ...s, platforms: [...s.platforms, { id: uid("plat"), ...data }] }));
    showToast("Plateforme ajoutée");
  }

  function handleDeletePlatform(id, name) {
    if (!window.confirm(`Supprimer la plateforme « ${name} » ? Les articles et ventes déjà associés ne seront pas supprimés.`)) return;
    setState((s) => ({ ...s, platforms: s.platforms.filter((p) => p.id !== id) }));
    showToast("Plateforme supprimée");
  }

  const currentProduct = route.params.id ? state.products.find((p) => p.id === route.params.id) : null;

  let content = null;
  if (route.page === "dashboard") content = <DashboardPage products={state.products} sales={state.sales} navigate={navigate} />;
  else if (route.page === "stock") content = <StockPage products={state.products} navigate={navigate} initialStatus={route.params.status} />;
  else if (route.page === "stock-new") content = <StockNewPage platforms={state.platforms} onCreate={handleCreateProduct} navigate={navigate} />;
  else if (route.page === "stock-edit") content = <StockEditPage product={currentProduct} platforms={state.platforms} onUpdate={handleUpdateProduct} navigate={navigate} />;
  else if (route.page === "stock-detail") content = <StockDetailPage product={currentProduct} platforms={state.platforms} navigate={navigate} onSell={handleSell} onArchive={handleArchive} onDelete={handleDelete} />;
  else if (route.page === "sales") content = <SalesPage sales={state.sales} />;
  else if (route.page === "analytics") content = <AnalyticsPage products={state.products} sales={state.sales} />;
  else if (route.page === "settings") content = <SettingsPage platforms={state.platforms} onAddPlatform={handleAddPlatform} onDeletePlatform={handleDeletePlatform} />;

  const navPage = route.page.startsWith("stock") ? "stock" : route.page;

  return (
    <ToastCtx.Provider value={showToast}>
      <div className="flex min-h-screen bg-base-950 text-base-100">
        <Sidebar page={navPage} navigate={navigate} />
        <main className="mx-auto w-full max-w-6xl flex-1 px-4 py-6 pb-24 md:px-8 md:py-8 md:pb-8">
          {content}
        </main>
        <BottomNav page={navPage} navigate={navigate} />
        <ToastHost toast={toast} />
      </div>
    </ToastCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
